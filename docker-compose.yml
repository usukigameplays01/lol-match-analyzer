services:
  db:
    image: postgres:16
    environment:
      # Credenciales solo para desarrollo local. En la nube se usan otras.
      POSTGRES_USER: lol
      POSTGRES_PASSWORD: lol
      POSTGRES_DB: lol
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lol -d lol"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lol:lol@db:5432/lol
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
